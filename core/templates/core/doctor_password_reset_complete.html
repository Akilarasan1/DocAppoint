{% extends "base.html" %}

{% block title %}Password updated{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card p-5 text-center mx-auto" style="max-width: 520px;">
        <div class="tone-green mb-3"><span class="icon-tile"><i class="bi bi-check2-circle"></i></span></div>
        <h1 class="h3">Password updated</h1>
        <p class="text-muted">Your password has been changed. You can now log in with the new one.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2">Go to log in</a>
    </div>
</div>
{% endblock %}
