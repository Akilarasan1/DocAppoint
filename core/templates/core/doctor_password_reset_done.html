{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card p-5 text-center mx-auto" style="max-width: 520px;">
        <span class="icon-tile mx-auto mb-3"><i class="bi bi-envelope-check"></i></span>
        <h1 class="h3">Check your email</h1>
        <p class="text-muted">If an account exists for that address, we've sent a link to reset your password. It may take a minute to arrive.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2">Back to log in</a>
    </div>
</div>
{% endblock %}
