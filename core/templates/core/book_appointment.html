<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }
    h2 {
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-weight: bold;
    }
    input, textarea {
      padding: 0.5rem;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    .login-prompt {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
      <h2>Book an Appointment</h2>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">Book Appointment</button>
        </form>

        {% if not request.user.is_authenticated %}
          <div class="login-prompt">
            Have an account? <a href="{% url 'login' %}?next=book_appointment">Login here</a>
          </div>
        {% endif %}

        <p><a href="{% url 'home' %}">Back to home</a></p>


</body>
</html>
